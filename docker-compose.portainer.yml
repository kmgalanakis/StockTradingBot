services:
  stocktradingbot:
    build: .
    image: stocktradingbot:latest
    # Build the image from the repo on every deploy. The image is not on Docker Hub, so never pull it.
    pull_policy: build
    container_name: stocktradingbot
    restart: unless-stopped
    # Portainer writes the stack's environment variables to this file.
    # Add the API keys and Telegram settings in the stack editor, never in git.
    env_file: stack.env
    volumes:
      # Logs and strategy_state.json are written to this folder on the server,
      # so they survive redeploys. Create the folder before the first deploy.
      # Set LOGS_DIR in the stack's environment variables to use another folder.
      # config.yaml is copied into the image, so config changes go through git.
      - ${LOGS_DIR:-/opt/stocktradingbot/logs}:/app/logs
